metadata:
  schema_version: rac/v1
  standards:
  - IEEE 29148
  - ISO/IEC 25010
  - Compliance-as-Code
  exported_at_utc: '2026-11-23T21:12:14Z'
  audit_summary:
    overall_score: 75.4
    ieee_29148_score: 40.0
    iso_25010_coverage_score: 88.0
    compliance_traceability_score: 100.0
    executive_summary: El borrador de requerimientos presenta una base sólida en la
      cobertura de normativas de cumplimiento y la definición de aspectos no funcionales.
      Sin embargo, se identifican ambigüedades significativas en los requerimientos
      funcionales, especialmente en la falta de criterios verificables y especificaciones
      detalladas para integraciones y reportes. Existe una brecha de trazabilidad
      donde varios requerimientos funcionales clave no están explícitamente vinculados
      a normativas de cumplimiento relevantes. La cobertura de ISO 25010 es robusta
      en la mayoría de las dimensiones críticas, aunque el aspecto de 'Mantenibilidad'
      carece de métricas cuantitativas específicas.
    findings:
    - id: AUD-001
      finding_type: Vacío
      severity: Alta
      affected_ids:
      - RF-001
      description: El requerimiento funcional RF-001 'Procesamiento de Pagos Multicanal'
        no enlaza a normativas críticas de seguridad (PCI-DSS, cifrado), rendimiento
        o fiabilidad, a pesar de ser un componente central del sistema de pagos.
      suggestion: Vincular RF-001 con RNF-001 (Protección de Datos Sensibles y Cumplimiento
        PCI-DSS), RNF-004 (Eficiencia de Desempeño del API de Pagos) y RNF-005 (Fiabilidad
        y Consistencia Transaccional) para asegurar la trazabilidad de los controles
        de seguridad y calidad.
    - id: AUD-002
      finding_type: Vacío
      severity: Alta
      affected_ids:
      - RF-008
      description: El requerimiento funcional RF-008 'Integración con ERP SAP para
        Pólizas Consolidadas' no enlaza a la normativa NORM-006 (Auditoría Inmutable
        y Retención de Logs Financieros), lo cual es crítico para la trazabilidad
        contable.
      suggestion: Vincular RF-008 con RNF-006 (Auditoría Inmutable y Retención de
        Registros) y NORM-006 para asegurar que la póliza consolidada cumpla con los
        requisitos de auditoría y retención.
    - id: AUD-003
      finding_type: Vacío
      severity: Alta
      affected_ids:
      - RF-009
      description: El requerimiento funcional RF-009 'Soporte Multimoneda y Cálculo
        de Impuestos Internacionales' no enlaza a la normativa NORM-006 (Auditoría
        Inmutable y Retención de Logs Financieros), lo cual es crítico para la trazabilidad
        fiscal y contable.
      suggestion: Vincular RF-009 con RNF-006 (Auditoría Inmutable y Retención de
        Registros) y NORM-006 para asegurar que los registros multimoneda y cálculos
        de impuestos cumplan con los requisitos de auditoría y retención.
    - id: AUD-004
      finding_type: Vacío
      severity: Alta
      affected_ids:
      - ISO 25010
      description: La dimensión 'Auditoría/Mantenibilidad' de ISO 25010 carece de
        métricas cuantitativas medibles para el aspecto de 'Mantenibilidad'. Aunque
        RNF-006 cubre 'Auditoría', no hay métricas para la facilidad de modificación,
        testeo o despliegue del sistema.
      suggestion: Añadir un Requerimiento No Funcional (RNF) específico para Mantenibilidad,
        incluyendo métricas como cobertura de pruebas unitarias (ej. >80%), complejidad
        ciclomática (ej. <10 por función) o tiempo medio de resolución de defectos
        (ej. <4 horas para defectos críticos).
    - id: AUD-005
      finding_type: Ambigüedad
      severity: Media
      affected_ids:
      - RF-001
      description: El requerimiento RF-001 indica 'sin redirigirlo fuera del flujo
        de compra' pero no especifica cómo se verificará este criterio o qué se considera
        una 'redirección'.
      suggestion: Definir claramente los criterios de verificación para 'sin redirigirlo
        fuera del flujo de compra', por ejemplo, 'El checkout debe permanecer en el
        mismo dominio y no requerir la apertura de nuevas pestañas o ventanas del
        navegador'.
    - id: AUD-006
      finding_type: Ambigüedad
      severity: Media
      affected_ids:
      - RF-003
      description: El requerimiento RF-003 menciona 'enviar dicho comprobante por
        correo electrónico al comprador' pero carece de detalles sobre el remitente,
        el asunto del correo, el cuerpo del mensaje o el manejo de fallos en el envío.
      suggestion: Especificar los detalles del envío del correo electrónico, incluyendo
        remitente, asunto, plantilla de correo y el comportamiento del sistema en
        caso de que el envío falle (ej. reintentos, notificación al equipo de soporte).
    - id: AUD-007
      finding_type: Vacío
      severity: Media
      affected_ids:
      - RF-004
      description: El requerimiento RF-004 especifica que el 'Líder de Tesorería'
        debe aprobar reembolsos mayores a $500 USD, pero este actor no está listado
        en el campo 'actor' del requerimiento, lo que puede generar confusión sobre
        las responsabilidades.
      suggestion: Actualizar el campo 'actor' de RF-004 para incluir explícitamente
        al 'Líder de Tesorería' o aclarar si el 'Personal de Soporte' es el único
        actor directo y el Líder de Tesorería es un actor secundario de aprobación.
    - id: AUD-008
      finding_type: Ambigüedad
      severity: Media
      affected_ids:
      - RF-005
      description: El requerimiento RF-005 utiliza el término 'alertas y notificaciones
        en tiempo real' sin definir qué se considera 'tiempo real' en este contexto
        (ej. latencia máxima aceptable).
      suggestion: Cuantificar el significado de 'tiempo real' para las alertas y notificaciones,
        por ejemplo, 'con una latencia máxima de 5 segundos desde la ocurrencia del
        evento'.
    - id: AUD-009
      finding_type: Ambigüedad
      severity: Media
      affected_ids:
      - RF-006
      description: El requerimiento RF-006 menciona 'gestión en tiempo real de Contracargos'
        sin definir qué se considera 'tiempo real' o qué acciones específicas de gestión
        se esperan.
      suggestion: Cuantificar el significado de 'tiempo real' para la gestión de contracargos
        y detallar las funcionalidades de gestión esperadas (ej. 'visualización de
        contracargos en un dashboard con actualización cada 60 segundos y capacidad
        de iniciar disputas en menos de 5 minutos').
    - id: AUD-010
      finding_type: Ambigüedad
      severity: Media
      affected_ids:
      - RF-008
      description: El requerimiento RF-008 'Integración con ERP SAP para Pólizas Consolidadas'
        carece de especificaciones sobre el formato de la póliza, la frecuencia de
        envío, el protocolo de integración (ej. API REST, SOAP, SFTP) y el manejo
        de errores o reintentos.
      suggestion: Detallar el formato de la póliza (ej. JSON, XML), la frecuencia
        de envío (ej. diario, cada hora), el protocolo de integración y el mecanismo
        de manejo de reintentos y errores con SAP.
    - id: AUD-011
      finding_type: Ambigüedad
      severity: Media
      affected_ids:
      - RF-009
      description: El requerimiento RF-009 'Soporte Multimoneda y Cálculo de Impuestos
        Internacionales' es ambiguo al no especificar las monedas soportadas, las
        fuentes de las tasas de cambio, ni las reglas tributarias internacionales
        aplicables.
      suggestion: Listar las monedas específicas a soportar, definir la fuente de
        las tasas de cambio (ej. Banco Central Europeo, API de terceros) y especificar
        las jurisdicciones fiscales y sus reglas tributarias relevantes.
    - id: AUD-012
      finding_type: Ambigüedad
      severity: Media
      affected_ids:
      - RF-010
      description: El requerimiento RF-010 'Generación de Reportes Ejecutivos de Tesorería'
        es ambiguo al no especificar el formato de los reportes (ej. CSV, Excel, PDF),
        la frecuencia de generación o los roles específicos con acceso a ellos.
      suggestion: Especificar el formato de los reportes, la frecuencia de generación
        (ej. semanal, mensual), y definir los roles de usuario que tendrán acceso
        a estos reportes ejecutivos.
    - id: AUD-013
      finding_type: Vacío
      severity: Media
      affected_ids:
      - RNF-003
      description: La regla 'Validar reintentos exponenciales para Webhooks salientes'
        no está explícitamente cubierta en el RNF-003 'Seguridad de Integraciones
        y Webhooks' ni en su `metric_target`, lo cual es importante para la robustez
        de las notificaciones.
      suggestion: Actualizar RNF-003 para incluir la validación de reintentos exponenciales
        para Webhooks salientes en su descripción o como parte de su `metric_target`.
    missing_compliance_ids: []
compliance_rules_indexed:
- id: NORM-001
  title: Cifrado de Datos en Reposo y en Tránsito
  category: Seguridad / Criptografía
  description: Toda información financiera, credenciales, tokens y datos sensibles
    de clientes debe cifrarse tanto en almacenamiento persistente como durante su
    transmisión entre microservicios y clientes externos.
  mandatory_controls:
  - Cifrado simétrico AES-256-GCM obligatorio para bases de datos, backups y almacenamiento
    de archivos fiscales.
  - Protocolo TLS 1.3 obligatorio en todos los endpoints HTTP, APIs internas y pasarelas
    externas.
  - Gestión centralizada de llaves criptográficas mediante KMS/HSM con rotación automática
    cada 90 días.
  keywords:
  - cifrado
  - datos en reposo
  - datos en transito
  - aes-256-gcm
  - tls 1.3
  - kms
  - hsm
  - criptografia
  - seguridad
  source_section: 'NORM-001: Cifrado de Datos en Reposo y en Tránsito'
- id: NORM-002
  title: Cumplimiento PCI-DSS v4.0 y Tokenización de Tarjetas
  category: Cumplimiento Regulatorio / PCI-DSS
  description: El módulo de pagos debe aislar los datos de tarjetas bancarias del
    entorno operativo mediante bóvedas certificadas, evitando almacenar datos prohibidos
    tras la autorización.
  mandatory_controls:
  - Prohibición absoluta de almacenar el código de seguridad CVV/CVC o datos de banda
    magnética después de la autorización.
  - Prohibición de persistir el PAN (número de tarjeta) en texto plano; uso obligatorio
    de Tokenización certificada PCI-DSS v4.0 para pagos recurrentes.
  - Enmascaramiento de PAN en interfaces y logs mostrando únicamente los últimos 4
    dígitos.
  keywords:
  - pci-dss
  - tokenizacion
  - tarjetas
  - cvv
  - cvc
  - pan
  - pagos
  - cumplimiento regulatorio
  - seguridad
  source_section: 'NORM-002: Cumplimiento PCI-DSS v4.0 y Tokenización de Tarjetas'
- id: NORM-003
  title: Autenticación Fuerte (MFA) y Control de Acceso Basado en Roles (RBAC)
  category: Seguridad / Control de Acceso
  description: El acceso a funciones administrativas, operaciones financieras sensibles
    y reportes ejecutivos debe regirse por el principio de mínimo privilegio y verificación
    multifactor.
  mandatory_controls:
  - Autenticación Multifactor (MFA) obligatoria para administradores, Tesorería y
    aprobación de reembolsos mayores a $500 USD.
  - Flujo de doble aprobación (maker-checker) para reembolsos superiores a $500 USD
    y cambios de configuración de comisiones o cuentas bancarias.
  - Modelo RBAC granular que separe explícitamente roles de Soporte Nivel 1, Tesorería,
    Riesgos y Auditoría.
  keywords:
  - mfa
  - rbac
  - autenticacion
  - control de acceso
  - minimo privilegio
  - maker-checker
  - seguridad
  source_section: 'NORM-003: Autenticación Fuerte (MFA) y Control de Acceso Basado
    en Roles (RBAC)'
- id: NORM-004
  title: Rendimiento y Latencia de API de Pagos
  category: Eficiencia de Desempeño (ISO 25010)
  description: Los servicios síncronos de autorización de pago y checkout deben responder
    en tiempos compatibles con la experiencia en tiempo real y absorber picos de demanda
    estacionales.
  mandatory_controls:
  - Latencia p95 menor a 300ms en los endpoints propios de procesamiento de pago y
    validación de token.
  - Capacidad mínima sostenida de 500 transacciones por segundo (TPS) en eventos de
    alta demanda sin degradación crítica.
  - Tiempos de espera (timeouts) configurables y circuit breakers hacia adquirentes
    externos.
  keywords:
  - rendimiento
  - latencia
  - api
  - pagos
  - iso 25010
  - tps
  - circuit breakers
  - eficiencia
  source_section: 'NORM-004: Rendimiento y Latencia de API de Pagos'
- id: NORM-005
  title: Alta Disponibilidad, Idempotencia y Recuperación ante Desastres (DRP)
  category: Fiabilidad / Disponibilidad (ISO 25010)
  description: La plataforma transaccional debe garantizar continuidad operativa y
    consistencia financiera frente a fallos de red, reintentos o caídas de nodos.
  mandatory_controls:
  - Acuerdo de Nivel de Servicio (SLA) de disponibilidad mínima del 99.95% mensual
    en el servicio de Checkout y Pagos.
  - Uso obligatorio de llaves de idempotencia (`Idempotency-Key`) en toda operación
    de cobro y reembolso para prevenir cargos duplicados.
  - Objetivos de recuperación RPO < 5 minutos y RTO < 15 minutos con arquitectura
    multi-zona.
  keywords:
  - alta disponibilidad
  - idempotencia
  - drp
  - recuperacion ante desastres
  - sla
  - rpo
  - rto
  - iso 25010
  - fiabilidad
  source_section: 'NORM-005: Alta Disponibilidad, Idempotencia y Recuperación ante
    Desastres (DRP)'
- id: NORM-006
  title: Auditoría Inmutable y Retención de Logs Financieros
  category: Auditoría / Trazabilidad Legal
  description: Toda operación monetaria, cambio de estado de factura, aprobación de
    reembolso y evento de contracargo debe dejar evidencia verificable a prueba de
    alteraciones.
  mandatory_controls:
  - Registro inmutable tipo WORM (Write-Once-Read-Many) con usuario, timestamp UTC,
    dirección IP, monto, moneda y resultado.
  - Retención obligatoria mínima de 7 años para trazas de auditoría financiera y comprobantes
    de facturación electrónica.
  - Correlación mediante `trace_id` distribuido entre checkout, facturación y conciliación
    bancaria.
  keywords:
  - auditoria
  - inmutable
  - logs financieros
  - worm
  - retencion de datos
  - trace_id
  - trazabilidad legal
  source_section: 'NORM-006: Auditoría Inmutable y Retención de Logs Financieros'
- id: NORM-007
  title: Protección de Datos Personales y Privacidad (PII)
  category: Privacidad / Protección de Datos
  description: El tratamiento de datos personales de compradores y representantes
    comerciales debe cumplir principios de minimización, consentimiento y confidencialidad.
  mandatory_controls:
  - Enmascaramiento automático de PII (documento de identidad, correo, teléfono) en
    logs técnicos y exportaciones no autorizadas.
  - Registro auditable de consentimiento explícito del titular para almacenamiento
    de métodos de pago tokenizados.
  - Procedimientos de anonimización o supresión compatibles con los plazos legales
    de retención fiscal.
  keywords:
  - proteccion de datos
  - privacidad
  - pii
  - minimización
  - consentimiento
  - confidencialidad
  - enmascaramiento
  - anonimizacion
  source_section: 'NORM-007: Protección de Datos Personales y Privacidad (PII)'
- id: NORM-008
  title: Seguridad de Integraciones, Webhooks y Prevención de Fraude
  category: Seguridad / Integraciones y Antifraude
  description: Las comunicaciones con comercios, pasarelas externas y sistemas ERP
    deben protegerse contra suplantación, abuso de APIs y fraude transaccional.
  mandatory_controls:
  - Firma criptográfica HMAC-SHA256 obligatoria con timestamp anti-replay en todos
    los Webhooks emitidos a comercios.
  - Mitigación OWASP API Security Top 10 incluyendo rate limiting estricto por cliente
    e IP.
  - Soporte obligatorio de autenticación 3-D Secure 2.2 y reglas de scoring antifraude
    para reducir contracargos (chargebacks).
  keywords:
  - seguridad
  - integraciones
  - webhooks
  - fraude
  - hmac-sha256
  - owasp api security
  - rate limiting
  - 3-d secure
  - antifraude
  source_section: 'NORM-008: Seguridad de Integraciones, Webhooks y Prevención de
    Fraude'
functional_requirements:
- id: RF-001
  title: Procesamiento de Pagos Multicanal
  description: El sistema debe permitir al cliente final realizar pagos a través de
    un Checkout Multicanal, soportando tarjetas de crédito/débito, transferencias
    bancarias vía PSE y billeteras digitales, sin redirigirlo fuera del flujo de compra.
  actor: Cliente final
  business_goal: Facilitar el proceso de pago y mejorar la experiencia del usuario.
  priority: Alta
  linked_compliance_ids: []
  glossary_terms_used:
  - Checkout Multicanal
  rationale: ''
  approved: true
- id: RF-002
  title: Soporte para Tokenización de Tarjetas
  description: El sistema debe soportar la Tokenización de Tarjetas para procesar
    cobros de suscripciones y pagos recurrentes de forma automática.
  actor: Sistema de Pagos
  business_goal: Habilitar modelos de negocio de suscripción y automatizar cobros
    recurrentes.
  priority: Alta
  linked_compliance_ids:
  - NORM-002
  glossary_terms_used:
  - Tokenización de Tarjetas
  - Bóveda de Tokenización
  rationale: ''
  approved: true
- id: RF-003
  title: Generación Automática de Asientos Contables y Facturación Electrónica
  description: El sistema debe generar automáticamente un Asiento Contable y disparar
    la emisión de una Factura Electrónica (en formato XML y PDF) ante la autoridad
    fiscal correspondiente (DIAN/CFDI) para cada pago aprobado, y enviar dicho comprobante
    por correo electrónico al comprador.
  actor: Sistema de Pagos/Facturación
  business_goal: Automatizar el registro contable y el cumplimiento fiscal post-pago.
  priority: Alta
  linked_compliance_ids:
  - NORM-006
  glossary_terms_used:
  - Asiento Contable
  - Factura Electrónica
  rationale: ''
  approved: true
- id: RF-004
  title: Gestión de Reembolsos con Doble Aprobación y MFA
  description: El sistema debe permitir al personal de soporte procesar Reembolsos
    de pagos a clientes, exigiendo un flujo de doble aprobación con Autenticación
    Multifactor (MFA) para Reembolsos mayores a $500 USD por parte del Líder de Tesorería.
  actor: Personal de Soporte
  business_goal: Mejorar la eficiencia en la atención al cliente y la gestión de devoluciones.
  priority: Alta
  linked_compliance_ids:
  - NORM-003
  - NORM-006
  glossary_terms_used:
  - Reembolso
  - Autenticación Multifactor (MFA)
  rationale: ''
  approved: true
- id: RF-005
  title: Notificaciones en Tiempo Real de Reembolsos y Contracargos
  description: El sistema debe enviar alertas y notificaciones en tiempo real sobre
    el estado de los Reembolsos y Contracargos a través de Webhooks firmados.
  actor: Sistema de Notificaciones
  business_goal: Mantener informados a los stakeholders sobre eventos críticos de
    tesorería y riesgo.
  priority: Media
  linked_compliance_ids:
  - NORM-008
  glossary_terms_used:
  - Reembolso
  - Contracargo
  - Webhook
  rationale: ''
  approved: true
- id: RF-006
  title: Gestión de Contracargos
  description: El sistema debe permitir la gestión en tiempo real de Contracargos.
  actor: Equipo de Riesgos
  business_goal: Reducir pérdidas por fraude y optimizar la resolución de disputas.
  priority: Alta
  linked_compliance_ids:
  - NORM-008
  glossary_terms_used:
  - Contracargo
  rationale: ''
  approved: true
- id: RF-007
  title: Automatización de Conciliación Bancaria
  description: El sistema debe automatizar la Conciliación Bancaria, cruzando extractos
    bancarios y reportes de adquirentes con las órdenes pagadas.
  actor: Sistema de Conciliación
  business_goal: Optimizar la gestión financiera y asegurar la exactitud de los registros.
  priority: Alta
  linked_compliance_ids:
  - NORM-006
  glossary_terms_used:
  - Conciliación Bancaria
  rationale: ''
  approved: true
- id: RF-008
  title: Integración con ERP SAP para Pólizas Consolidadas
  description: El sistema debe enviar la póliza consolidada de transacciones al sistema
    ERP SAP.
  actor: Sistema de Integración
  business_goal: Integrar los datos financieros con el sistema contable central.
  priority: Alta
  linked_compliance_ids: []
  glossary_terms_used:
  - Asiento Contable
  rationale: ''
  approved: true
- id: RF-009
  title: Soporte Multimoneda y Cálculo de Impuestos Internacionales
  description: El sistema debe soportar transacciones y registros en múltiples monedas,
    incluyendo el cálculo de impuestos internacionales aplicables.
  actor: Sistema de Pagos/Facturación
  business_goal: Habilitar operaciones en mercados internacionales y asegurar el cumplimiento
    fiscal.
  priority: Alta
  linked_compliance_ids: []
  glossary_terms_used:
  - Factura Electrónica
  rationale: ''
  approved: true
- id: RF-010
  title: Generación de Reportes Ejecutivos de Tesorería
  description: El sistema debe generar Reportes Ejecutivos de Tesorería que incluyan
    flujo de caja, comisiones de pasarela y saldos por conciliar.
  actor: Sistema de Reportes
  business_goal: Proporcionar visibilidad financiera para la toma de decisiones.
  priority: Alta
  linked_compliance_ids:
  - NORM-003
  - NORM-007
  glossary_terms_used:
  - Conciliación Bancaria
  - Asiento Contable
  rationale: ''
  approved: true
non_functional_requirements:
- id: RNF-001
  title: Protección de Datos Sensibles y Cumplimiento PCI-DSS
  iso_25010_category: Seguridad
  description: El sistema debe proteger los datos sensibles de tarjetas de pago y
    otros datos sensibles de acuerdo con los estándares de seguridad de la industria
    y normativas de cifrado.
  metric_target: Certificación PCI-DSS v4.0; Prohibido almacenar CVV/CVC; PAN tokenizado;
    Cifrado AES-256-GCM en reposo para datos sensibles; TLS 1.3 obligatorio en tránsito.
  linked_compliance_ids:
  - NORM-002
  - NORM-001
  linked_rf_ids:
  - RF-001
  - RF-002
  - RF-003
  - RF-004
  - RF-006
  approved: true
- id: RNF-002
  title: Autenticación Fuerte y Control de Acceso
  iso_25010_category: Seguridad
  description: El sistema debe implementar autenticación multifactor (MFA) y control
    de acceso basado en roles (RBAC) para operaciones sensibles y acceso a información
    financiera.
  metric_target: MFA obligatorio para reembolsos > $500 USD y acceso a reportes/bitácoras;
    Flujo de doble aprobación para reembolsos > $500 USD; Modelo RBAC granular.
  linked_compliance_ids:
  - NORM-003
  linked_rf_ids:
  - RF-004
  - RF-010
  approved: true
- id: RNF-003
  title: Seguridad de Integraciones y Webhooks
  iso_25010_category: Seguridad
  description: El sistema debe asegurar la integridad y autenticidad de las comunicaciones
    salientes mediante firma criptográfica y protocolos seguros.
  metric_target: Webhooks salientes firmados con HMAC-SHA256 con timestamp anti-replay;
    Mitigación OWASP API Security Top 10; TLS 1.3 para todas las comunicaciones HTTP.
  linked_compliance_ids:
  - NORM-008
  - NORM-001
  linked_rf_ids:
  - RF-005
  approved: true
- id: RNF-004
  title: Eficiencia de Desempeño del API de Pagos
  iso_25010_category: Eficiencia de Desempeño
  description: El sistema debe garantizar una alta eficiencia de desempeño para el
